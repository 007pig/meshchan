name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter and bundled Dart
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Print SDK versions
        run: |
          flutter --version --machine
          dart --version

      - name: Get locked workspace dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze --fatal-infos

      - name: Test CLI
        working-directory: apps/meshctl
        run: dart test

      - name: Test core suite without hardware
        working-directory: packages/meshcore_link
        run: dart test

      - name: Build native CLI bundle
        working-directory: apps/meshctl
        run: dart build cli --target=bin/meshctl.dart --output=build/dist

      - name: Build serial transport check without opening hardware
        working-directory: packages/meshcore_link
        run: dart build cli --target=example/serial_transport_check.dart --output=build/serial-transport-check

      - name: Verify source and native entry points without hardware
        run: |
          python3 --version
          python3 tool/smoke_cli.py \
            --dart "$(command -v dart)" \
            --cli-bundle apps/meshctl/build/dist/bundle \
            --observation-bundle packages/meshcore_link/build/serial-transport-check/bundle

      - name: Check patch whitespace
        run: git diff --check
