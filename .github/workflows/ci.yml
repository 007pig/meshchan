name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter and bundled Dart
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Print SDK versions
        run: |
          flutter --version --machine
          dart --version

      - name: Get locked workspace dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze --fatal-infos

      - name: Test CLI
        working-directory: apps/meshctl
        run: dart test

      - name: Test serial diagnostics without hardware
        working-directory: packages/meshcore_link
        run: dart test

      - name: Smoke test CLI
        working-directory: apps/meshctl
        run: |
          dart run bin/meshctl.dart --help
          dart run bin/meshctl.dart --version
          dart run bin/meshctl.dart ports --help
          dart run bin/meshctl.dart port-check --help

      - name: Build and run native CLI bundle
        working-directory: apps/meshctl
        run: |
          dart build cli --target=bin/meshctl.dart --output=build/dist
          build/dist/bundle/bin/meshctl --help
          build/dist/bundle/bin/meshctl --version

      - name: Build serial transport check without opening hardware
        working-directory: packages/meshcore_link
        run: dart build cli --target=example/serial_transport_check.dart --output=build/serial-transport-check

      - name: Verify Linux enumeration is rejected safely
        working-directory: apps/meshctl
        run: |
          python3 - <<'PY'
          import subprocess

          expected = (
              "Error: Serial port enumeration is unavailable on Linux with "
              "libserialport_plus 1.0.5: the native backend can open unselected ports."
          )
          commands = [
              ["dart", "run", "bin/meshctl.dart", "ports"],
              ["build/dist/bundle/bin/meshctl", "ports"],
          ]
          for command in commands:
              result = subprocess.run(command, capture_output=True, text=True)
              assert result.returncode == 69, (command, result.returncode, result.stderr)
              assert not result.stdout, (command, result.stdout)
              # Dart build-hook progress can share the diagnostic's stderr line.
              assert expected in result.stderr, (command, result.stderr)
              assert "#0" not in result.stderr, (command, result.stderr)
              print(f"Verified native enumeration rejection: {command}")
          PY
