name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter and bundled Dart
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Print SDK versions
        run: |
          flutter --version --machine
          dart --version

      - name: Get locked workspace dependencies
        run: dart pub get --enforce-lockfile

      - name: Generate production database and dependency probe
        working-directory: packages/meshchan_core
        run: dart run build_runner build

      - name: Check production schema snapshot and generated helpers
        working-directory: packages/meshchan_core
        run: dart run tool/check_schema.dart

      - name: Check tracked production and probe artifacts
        run: |
          git ls-files --error-unmatch packages/meshchan_core/lib/src/storage/database.g.dart packages/meshchan_core/test/support/dependency_probe_database.g.dart packages/meshchan_core/drift_schemas/drift_schema_v1.json packages/meshchan_core/test/storage/generated/schema.dart packages/meshchan_core/test/storage/generated/schema_v1.dart
          git diff --exit-code -- packages/meshchan_core/lib/src/storage/database.g.dart packages/meshchan_core/test/support/dependency_probe_database.g.dart packages/meshchan_core/drift_schemas packages/meshchan_core/test/storage/generated

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze workspace
        run: dart analyze --fatal-infos

      - name: Test finite acceptance plan validation without hardware
        run: python3 -m unittest discover -s tool -p '*_test.py'

      - name: Test offline values, real SQLite files, ownership and failure paths
        working-directory: packages/meshchan_core
        run: dart test

      - name: Test CLI
        working-directory: apps/meshctl
        run: dart test

      - name: Test core suite without hardware
        working-directory: packages/meshcore_link
        run: dart test

      - name: Build native CLI bundle
        working-directory: apps/meshctl
        run: dart build cli --target=bin/meshctl.dart --output=build/dist

      - name: Build serial transport check without opening hardware
        working-directory: packages/meshcore_link
        run: dart build cli --target=example/serial_transport_check.dart --output=build/serial-transport-check

      - name: Build development datagram acceptance bundle
        working-directory: apps/meshctl
        run: dart build cli --target=tool/datagram_acceptance.dart --output=build/datagram-acceptance

      - name: Verify source and native entry points without hardware
        run: |
          python3 --version
          python3 tool/smoke_cli.py \
            --dart "$(command -v dart)" \
            --cli-bundle apps/meshctl/build/dist/bundle \
            --observation-bundle packages/meshcore_link/build/serial-transport-check/bundle \
            --datagram-acceptance-bundle apps/meshctl/build/datagram-acceptance/bundle

      - name: Check patch whitespace
        run: git diff --check
